name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Type check
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Security scan
        run: bandit -q -r app

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt
        continue-on-error: true

      - name: Tests
        run: pytest

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  benchmark:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Generate synthetic corpus
        run: python scripts/generate_data.py --households 25 --months 14

      - name: Train classifier
        run: python scripts/train_classifier.py

      - name: Benchmark all engines
        run: python scripts/benchmark.py

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: data/benchmark_report.json

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finance-forecaster:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name ff -p 8000:8000 finance-forecaster:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break || sleep 2
          done
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"'
          docker rm -f ff