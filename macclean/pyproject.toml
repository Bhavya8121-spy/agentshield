[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macclean"
version = "0.1.0"
description = "Safe, developer-focused macOS storage cleanup CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
macclean = "macclean.cli:main"

[tool.setuptools.packages.find]
include = ["macclean*"]

[tool.setuptools.package-data]
"macclean.web" = ["index.html", "static/*"]
