[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-demo-sdk"
version = "0.1.0"
description = "AgentShield local policy and synthetic demo client (not a production security gateway)"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["agentshield_sdk*"]
