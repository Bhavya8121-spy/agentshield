<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Cafe POS</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #eceff1;
        margin: 0;
        padding: 20px;
        color: #333;
    }
    h2, h3 {
        margin-top: 0;
        color: #455a64;
    }
    .pos-container {
        display: flex;
        gap: 20px;
        max-width: 1300px;
        margin: 0 auto;
        height: 90vh;
    }
    
    /* Left Panel: Navigation and Main Display */
    .left-panel {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .main-categories {
        display: flex;
        gap: 10px;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .main-categories button {
        flex: 1;
        padding: 15px 10px;
        background-color: #37474f;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }
    .main-categories button:hover, .main-categories button.active { 
        background-color: #ff9800; 
        color: #fff;
    }

    /* Dynamic Display Area */
    .dynamic-display {
        flex: 1;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        overflow-y: auto;
    }

    /* Drink Grid */
    .drink-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
    }
    .drink-grid button {
        padding: 30px 10px;
        font-size: 15px;
        background-color: #0277bd;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: 0.2s;
    }
    .drink-grid button:hover { background-color: #01579b; }

    /* Customization Panel */
    .customization-panel {
        display: none; 
        flex-direction: column;
        gap: 20px;
    }
    .sub-option-group {
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
    }
    .sub-option-group h3 {
        font-size: 16px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .btn-group button {
        padding: 10px 15px;
        font-size: 13px;
        background-color: #f5f5f5;
        border: 1px solid #cfd8dc;
        border-radius: 4px;
        cursor: pointer;
        color: #333;
        font-weight: 500;
    }
    .btn-group button:hover { background-color: #e0e0e0; }
    
    .btn-group.modifiers button {
        background-color: #e3f2fd;
        border-color: #90caf9;
        color: #1565c0;
    }
    .btn-group.modifiers button.mod-active {
        background-color: #1565c0;
        color: white;
    }

    /* Right Panel: Order Ticket */
    .right-panel {
        flex: 1;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
    }
    .ticket {
        flex: 1;
        background: #fafafa;
        border: 1px solid #ddd;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    
    .ticket-item {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
    }
    .ticket-item.active-item {
        border: 2px solid #ff9800;
        background: #fff8e1;
    }
    .ticket-item-header {
        font-weight: bold;
        font-size: 16px;
        color: #d32f2f;
        display: flex;
        justify-content: space-between;
    }
    .ticket-base-milk {
        font-size: 13px;
        color: #0277bd;
        margin-top: 5px;
        font-weight: bold;
    }
    .ticket-customization {
        font-size: 13px;
        color: #555;
        margin-left: 10px;
        margin-top: 3px;
    }
    .ticket-customization::before {
        content: "- ";
    }
    
    /* Action Buttons */
    .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
    }
    .action-btn {
        padding: 12px;
        font-size: 14px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
    }
    .btn-next { background-color: #7cb342; }
    .btn-next:hover { background-color: #689f38; }
    .btn-duplicate { background-color: #8e24aa; }
    .btn-duplicate:hover { background-color: #7b1fa2; }
    .btn-qty { background-color: #424242; }
    .btn-qty:hover { background-color: #212121; }
    .btn-clear { background-color: #e53935; }
    .btn-clear:hover { background-color: #c62828; }
    .btn-save { background-color: #1976d2; margin-top: auto; padding: 15px; font-size: 16px; margin-bottom: 10px; }
    .btn-save:hover { background-color: #1565c0; }
    .btn-history { background-color: #00838f; padding: 12px; font-size: 14px; }
    .btn-history:hover { background-color: #006064; }

    /* Modals (Numpad & History) */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    
    /* Numpad styles */
    .numpad {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 250px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .numpad-display {
        width: 100%;
        height: 50px;
        font-size: 24px;
        text-align: right;
        margin-bottom: 15px;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .numpad-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }
    .numpad-grid button {
        padding: 15px;
        font-size: 18px;
        border: none;
        background: #e0e0e0;
        border-radius: 5px;
        cursor: pointer;
    }
    .numpad-grid button:hover { background: #bdbdbd; }
    .numpad-grid .btn-confirm { grid-column: span 2; background: #4caf50; color: white; }
    .numpad-grid .btn-confirm:hover { background: #388e3c; }
    .numpad-grid .btn-clear-num { background: #ef5350; color: white; }

    /* History styles */
    .history-container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        width: 600px;
        max-width: 90%;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }
    .history-header button {
        background: #e53935;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
    }
    .history-content {
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    .history-entry {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 6px;
    }
    .history-entry-top {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        color: #1565c0;
        margin-bottom: 10px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 5px;
    }
    .history-drink-line {
        font-size: 14px;
        margin-bottom: 5px;
        color: #333;
    }
    .history-drink-mods {
        font-size: 13px;
        color: #666;
        margin-left: 15px;
        font-style: italic;
    }

</style>
</head>
<body>

<div class="pos-container">
    <!-- Left Side: Navigation & Drinks/Customizations -->
    <div class="left-panel">
        
        <!-- Main Categories -->
        <div class="main-categories" id="category-buttons">
            <button onclick="loadCategory('Espresso')" id="btn-espresso" class="active">Espresso</button>
            <button onclick="loadCategory('Tea')">Tea</button>
            <button onclick="loadCategory('Matcha')">Matcha</button>
            <button onclick="loadCategory('Refreshers')">Refreshers</button>
            <button onclick="loadCategory('Blended')">Blended</button>
        </div>

        <div class="dynamic-display">
            <!-- Drink Grid -->
            <div class="drink-grid" id="drink-grid"></div>

            <!-- Customization Panel -->
            <div class="customization-panel" id="customization-panel">
                <div class="sub-option-group">
                    <h3>
                        Modifiers
                        <button class="action-btn btn-qty" style="width: auto; padding: 5px 15px;" onclick="openNumpad()">Change Qty</button>
                    </h3>
                    <div class="btn-group modifiers" id="modifier-group">
                        <button onclick="setModifier('Add', this)">Add</button>
                        <button onclick="setModifier('Remove', this)">Remove</button>
                        <button onclick="setModifier('Extra', this)">Extra</button>
                        <button onclick="setModifier('Light', this)">Light</button>
                        <button onclick="setModifier('Splash of', this)">Splash</button>
                    </div>
                </div>

                <div class="sub-option-group">
                    <h3>Milks (Select normally for Base, use 'Splash' modifier for extras)</h3>
                    <div class="btn-group">
                        <button onclick="handleMilk('Whole Milk')">Whole Milk</button>
                        <button onclick="handleMilk('Oat Milk')">Oat Milk</button>
                        <button onclick="handleMilk('Almond Milk')">Almond Milk</button>
                        <button onclick="handleMilk('Soy Milk')">Soy Milk</button>
                        <button onclick="handleMilk('Skim Milk')">Skim Milk</button>
                    </div>
                </div>

                <div class="sub-option-group">
                    <h3>Number of Shots</h3>
                    <div class="btn-group">
                        <button onclick="addCustomization('1 Shot')">1 Shot</button>
                        <button onclick="addCustomization('2 Shots')">2 Shots</button>
                        <button onclick="addCustomization('3 Shots')">3 Shots</button>
                        <button onclick="addCustomization('4 Shots')">4 Shots</button>
                        <button onclick="addCustomization('Decaf')">Decaf</button>
                    </div>
                </div>

                <div class="sub-option-group">
                    <h3>Sweeteners & Syrups</h3>
                    <div class="btn-group">
                        <button onclick="addCustomization('Stevia')">Stevia</button>
                        <button onclick="addCustomization('Brown Sugar')">Brown Sugar</button>
                        <button onclick="addCustomization('Vanilla Syrup')">Vanilla Syrup</button>
                        <button onclick="addCustomization('Caramel Syrup')">Caramel Syrup</button>
                    </div>
                </div>

                <div class="sub-option-group">
                    <h3>Temperature & Toppings</h3>
                    <div class="btn-group">
                        <button onclick="addCustomization('Hot')">Hot</button>
                        <button onclick="addCustomization('Iced')">Iced</button>
                        <button onclick="addCustomization('Ice')">Ice</button>
                        <button onclick="addCustomization('Water')">Water</button>
                        <button onclick="addCustomization('Boba')">Boba</button>
                        <button onclick="addCustomization('Cold Foam')">Cold Foam</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side: Order Ticket -->
    <div class="right-panel">
        <h2>Order Ticket</h2>
        <div class="ticket" id="order-ticket">
            <!-- Drinks append here -->
        </div>

        <div class="action-grid">
            <button class="action-btn btn-next" onclick="showDrinkGrid()">+ Next Drink</button>
            <button class="action-btn btn-duplicate" onclick="duplicateDrink()">Copy Drink</button>
        </div>
        <button class="action-btn btn-clear" onclick="clearOrder()">Clear Entire Order</button>
        <button class="action-btn btn-save" onclick="saveOrder()">Save Order</button>
        <button class="action-btn btn-history" onclick="openHistoryModal()">View History</button>
    </div>
</div>

<!-- Numpad Modal -->
<div class="modal-overlay" id="numpad-modal">
    <div class="numpad">
        <h3 style="margin-top:0; text-align:center;">Enter Quantity</h3>
        <input type="text" class="numpad-display" id="numpad-display" readonly>
        <div class="numpad-grid">
            <button onclick="numpadPress('7')">7</button>
            <button onclick="numpadPress('8')">8</button>
            <button onclick="numpadPress('9')">9</button>
            <button onclick="numpadPress('4')">4</button>
            <button onclick="numpadPress('5')">5</button>
            <button onclick="numpadPress('6')">6</button>
            <button onclick="numpadPress('1')">1</button>
            <button onclick="numpadPress('2')">2</button>
            <button onclick="numpadPress('3')">3</button>
            <button class="btn-clear-num" onclick="numpadClear()">C</button>
            <button onclick="numpadPress('0')">0</button>
            <button class="btn-confirm" onclick="numpadConfirm()">OK</button>
        </div>
    </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="history-modal">
    <div class="history-container">
        <div class="history-header">
            <h2 style="margin: 0; color: #00838f;">Order History</h2>
            <button onclick="closeHistoryModal()">Close</button>
        </div>
        <div class="history-content" id="history-content">
            <!-- History entries load here -->
        </div>
    </div>
</div>

<script>
    // Menu Database
    const menuData = {
        "Espresso": ["Latte", "Cappuccino", "Americano", "Macchiato", "Cortado", "Mocha", "Flat White"],
        "Tea": ["Chai Tea Latte", "Earl Grey", "English Breakfast", "Peach Green Tea", "Passion Tango Tea"],
        "Matcha": ["Hot Matcha Latte", "Iced Matcha Latte", "Matcha Lemonade", "Matcha Frappe"],
        "Refreshers": ["Strawberry Acai", "Mango Dragonfruit", "Pineapple Passionfruit", "Watermelon Mint"],
        "Blended": ["Vanilla Bean Frappe", "Mocha Frappe", "Caramel Blended", "Strawberry Blended"]
    };

    // State Variables
    let order = [];
    let orderHistory = []; // Array to store past orders
    let currentDrinkId = null;
    let nextDrinkId = 1;
    let orderCounter = 1; // Used for receipt numbering
    let activeModifier = "";

    // Initialize Page: Default to Espresso
    window.onload = function() {
        loadCategory('Espresso');
    };

    function loadCategory(category) {
        showDrinkGrid();
        const buttons = document.querySelectorAll('.main-categories button');
        buttons.forEach(btn => btn.classList.remove('active'));
        event ? event.target.classList.add('active') : document.getElementById('btn-espresso').classList.add('active');

        const grid = document.getElementById('drink-grid');
        grid.innerHTML = "";
        
        menuData[category].forEach(drink => {
            const btn = document.createElement('button');
            btn.textContent = drink;
            btn.onclick = () => selectDrink(drink);
            grid.appendChild(btn);
        });
    }

    function selectDrink(drinkName) {
        let newDrink = {
            id: nextDrinkId++,
            name: drinkName,
            qty: 1,
            baseMilk: "Standard Milk",
            customizations: []
        };
        
        order.push(newDrink);
        currentDrinkId = newDrink.id;
        
        updateTicket();
        showCustomizationPanel();
    }

    function showDrinkGrid() {
        document.getElementById('drink-grid').style.display = 'grid';
        document.getElementById('customization-panel').style.display = 'none';
        currentDrinkId = null; 
        updateTicket(); 
    }

    function showCustomizationPanel() {
        document.getElementById('drink-grid').style.display = 'none';
        document.getElementById('customization-panel').style.display = 'flex';
        clearModifier();
    }

    function setModifier(mod, btnElement) {
        activeModifier = mod;
        const modBtns = document.querySelectorAll('.modifiers button');
        modBtns.forEach(btn => btn.classList.remove('mod-active'));
        btnElement.classList.add('mod-active');
    }

    function clearModifier() {
        activeModifier = "";
        const modBtns = document.querySelectorAll('.modifiers button');
        modBtns.forEach(btn => btn.classList.remove('mod-active'));
    }

    function handleMilk(milkType) {
        let drink = order.find(d => d.id === currentDrinkId);
        if (!drink) return;

        if (activeModifier === "Splash of" || activeModifier !== "") {
            addCustomization(milkType);
        } else {
            drink.baseMilk = milkType;
            updateTicket();
        }
    }

    function addCustomization(item) {
        let drink = order.find(d => d.id === currentDrinkId);
        if (!drink) return;
        
        let finalItem = activeModifier ? `${activeModifier} ${item}` : item;
        drink.customizations.push(finalItem);
        
        clearModifier();
        updateTicket();
    }

    function duplicateDrink() {
        let drink = order.find(d => d.id === currentDrinkId);
        if (!drink) {
            alert("Please select a drink to duplicate.");
            return;
        }
        let clonedDrink = JSON.parse(JSON.stringify(drink));
        clonedDrink.id = nextDrinkId++;
        order.push(clonedDrink);
        currentDrinkId = clonedDrink.id;
        updateTicket();
        showCustomizationPanel();
    }

    function setActiveDrink(id) {
        currentDrinkId = id;
        updateTicket();
        showCustomizationPanel();
    }

    function updateTicket() {
        const ticketDiv = document.getElementById('order-ticket');
        ticketDiv.innerHTML = "";

        if (order.length === 0) {
            ticketDiv.innerHTML = "<p style='color:#777; text-align:center; margin-top:50px;'>Start an order by selecting a drink.</p>";
            return;
        }

        order.forEach(drink => {
            const itemDiv = document.createElement('div');
            itemDiv.className = "ticket-item";
            if (drink.id === currentDrinkId) {
                itemDiv.classList.add("active-item");
            }
            itemDiv.onclick = () => setActiveDrink(drink.id);

            const header = document.createElement('div');
            header.className = "ticket-item-header";
            header.innerHTML = `<span>${drink.qty}x ${drink.name}</span>`;
            itemDiv.appendChild(header);

            const milkDiv = document.createElement('div');
            milkDiv.className = "ticket-base-milk";
            milkDiv.textContent = `Base: ${drink.baseMilk}`;
            itemDiv.appendChild(milkDiv);

            drink.customizations.forEach(cust => {
                const custDiv = document.createElement('div');
                custDiv.className = "ticket-customization";
                custDiv.textContent = cust;
                itemDiv.appendChild(custDiv);
            });

            ticketDiv.appendChild(itemDiv);
        });
        ticketDiv.scrollTop = ticketDiv.scrollHeight;
    }

    function clearOrder() {
        order = [];
        currentDrinkId = null;
        updateTicket();
        showDrinkGrid();
    }

    function saveOrder() {
        if (order.length === 0) {
            alert("Ticket is empty.");
            return;
        }
        
        let totalDrinks = order.reduce((sum, drink) => sum + drink.qty, 0);
        
        // Save to History Log
        const timestamp = new Date().toLocaleString();
        orderHistory.push({
            orderNumber: orderCounter++,
            time: timestamp,
            drinks: JSON.parse(JSON.stringify(order)), // Deep copy of the array
            total: totalDrinks
        });

        alert(`Order saved successfully!\n\nTotal Drinks: ${totalDrinks}`);
        
        clearOrder();
        document.getElementById('btn-espresso').click();
    }

    /* --- Numpad Logic --- */
    function openNumpad() {
        let drink = order.find(d => d.id === currentDrinkId);
        if (!drink) return;
        document.getElementById('numpad-display').value = drink.qty;
        document.getElementById('numpad-modal').style.display = 'flex';
    }
    function numpadPress(num) {
        let display = document.getElementById('numpad-display');
        if (display.value === "0" || display.value === "") { display.value = num; } 
        else { display.value += num; }
    }
    function numpadClear() {
        document.getElementById('numpad-display').value = "";
    }
    function numpadConfirm() {
        let drink = order.find(d => d.id === currentDrinkId);
        if (drink) {
            let newQty = parseInt(document.getElementById('numpad-display').value);
            if (isNaN(newQty) || newQty < 1) { newQty = 1; }
            drink.qty = newQty;
            updateTicket();
        }
        document.getElementById('numpad-modal').style.display = 'none';
    }

    /* --- History Logic --- */
    function openHistoryModal() {
        const contentDiv = document.getElementById('history-content');
        contentDiv.innerHTML = "";

        if (orderHistory.length === 0) {
            contentDiv.innerHTML = "<p style='text-align:center; color:#666; margin-top:20px;'>No orders have been saved yet.</p>";
        } else {
            // Clone array and reverse so newest shows at the top
            let displayHistory = [...orderHistory].reverse();
            
            displayHistory.forEach(pastOrder => {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'history-entry';

                const topBar = document.createElement('div');
                topBar.className = 'history-entry-top';
                topBar.innerHTML = `<span>Order #${pastOrder.orderNumber} (${pastOrder.total} drinks)</span> <span>${pastOrder.time}</span>`;
                entryDiv.appendChild(topBar);

                pastOrder.drinks.forEach(drink => {
                    const drinkLine = document.createElement('div');
                    drinkLine.className = 'history-drink-line';
                    drinkLine.textContent = `${drink.qty}x ${drink.name} (Base: ${drink.baseMilk})`;
                    entryDiv.appendChild(drinkLine);

                    if (drink.customizations.length > 0) {
                        const modsLine = document.createElement('div');
                        modsLine.className = 'history-drink-mods';
                        modsLine.textContent = `+ ${drink.customizations.join(', ')}`;
                        entryDiv.appendChild(modsLine);
                    }
                });

                contentDiv.appendChild(entryDiv);
            });
        }
        
        document.getElementById('history-modal').style.display = 'flex';
    }

    function closeHistoryModal() {
        document.getElementById('history-modal').style.display = 'none';
    }
</script>

</body>
</html>
