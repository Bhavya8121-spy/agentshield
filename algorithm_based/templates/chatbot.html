<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Arcade — Chat</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-bg-soft: #172033;
            --card-border: #334155;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-red: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem 1.5rem;
        }

        .shell {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        header .titles h1 {
            font-size: 2rem;
            margin: 0 0 0.15rem 0;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header .titles p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: border-color 0.2s, color 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .chips-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .chip {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.45rem 0.9rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
        }

        .chip:hover {
            border-color: var(--accent-green);
            color: var(--text-main);
        }

        #chat-window {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            background: var(--card-bg-soft);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .msg-row { display: flex; }
        .msg-row.user { justify-content: flex-end; }
        .msg-row.bot { justify-content: flex-start; }

        .bubble {
            max-width: 82%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.97rem;
            white-space: pre-wrap;
        }

        .msg-row.bot .bubble {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top-left-radius: 3px;
        }

        .msg-row.user .bubble {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-top-right-radius: 3px;
        }

        .bot-label {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
            display: block;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 0.3rem 0;
        }
        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: bounce 1.2s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-4px); opacity: 1; }
        }

        .game-cards {
            display: grid;
            gap: 0.6rem;
            margin-top: 0.6rem;
        }

        .game-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            gap: 0.75rem;
        }

        .game-card .info strong { display: block; font-size: 0.92rem; }
        .game-card .info span { color: var(--text-muted); font-size: 0.78rem; }

        .play-link {
            background: var(--accent-green);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            white-space: nowrap;
        }
        .play-link:hover { background: #059669; }

        .generated-card {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.3);
        }

        .error-text { color: var(--accent-red); }

        #chat-form {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        #chat-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            font-size: 0.97rem;
            font-family: inherit;
        }
        #chat-input:focus { outline: none; border-color: var(--accent-cyan); }

        #send-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0 1.4rem;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }
        #send-btn:hover:not(:disabled) { background: #059669; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="shell">
    <header>
        <div class="titles">
            <h1>Algorithm Arcade</h1>
            <p>Tell the bot what you want to learn — it builds the puzzle.</p>
        </div>
        <a href="/dashboard" class="nav-btn">
            📋 All Games
        </a>
    </header>

    <div class="chips-row" id="chips-row">
        <span class="chip" data-msg="show me all games">📋 See all games</span>
        <span class="chip" data-msg="A* pathfinding">A* Pathfinding</span>
        <span class="chip" data-msg="Q-learning">Q-Learning</span>
        <span class="chip" data-msg="binary search">Binary Search</span>
        <span class="chip" data-msg="Dijkstra's algorithm">Dijkstra's Algorithm</span>
    </div>

    <div id="chat-window"></div>

    <form id="chat-form">
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="e.g. &quot;Explain quicksort&quot; or &quot;play Pong&quot;..." />
        <button id="send-btn" type="submit">Send</button>
    </form>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chipsRow = document.getElementById('chips-row');

    let history = [];

    function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addUserBubble(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="bubble"></div>`;
        row.querySelector('.bubble').textContent = text;
        chatWindow.appendChild(row);
        scrollToBottom();
    }

    function addBotBubble() {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.innerHTML = `<div class="bubble"><span class="bot-label">Arcade Bot</span><div class="bot-content"></div></div>`;
        chatWindow.appendChild(row);
        scrollToBottom();
        return row.querySelector('.bot-content');
    }

    function showTyping() {
        const content = addBotBubble();
        content.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
        return content;
    }

    function renderGameCard(container, game, highlight) {
        const wrap = document.createElement('div');
        wrap.className = 'game-cards';
        const card = document.createElement('div');
        card.className = 'game-card' + (highlight ? ' generated-card' : '');
        card.innerHTML = `
            <div class="info">
                <strong>${escapeHtml(game.name)}</strong>
                <span>${escapeHtml(game.family || '')}${game.strategy ? ' · ' + escapeHtml(game.strategy) : ''}</span>
            </div>
            <a class="play-link" href="${game.play_url}">▶ Play</a>
        `;
        wrap.appendChild(card);
        container.appendChild(wrap);
    }

    function renderGameList(container, games) {
        const wrap = document.createElement('div');
        wrap.className = 'game-cards';
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="info">
                    <strong>${escapeHtml(g.name)}</strong>
                    <span>${escapeHtml(g.family || '')}${g.strategy ? ' · ' + escapeHtml(g.strategy) : ''}</span>
                </div>
                <a class="play-link" href="${g.play_url}">▶ Play</a>
            `;
            wrap.appendChild(card);
        });
        container.appendChild(wrap);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
    }

    async function sendMessage(text) {
        if (!text.trim()) return;
        addUserBubble(text);
        history.push({ role: 'user', text });
        chatInput.value = '';
        sendBtn.disabled = true;

        const typingContent = showTyping();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history }),
            });
            const data = await res.json();

            typingContent.innerHTML = '';
            const replyP = document.createElement('div');
            replyP.textContent = data.reply || '';
            if (data.type === 'error') replyP.classList.add('error-text');
            typingContent.appendChild(replyP);

            if (data.type === 'game_list' && Array.isArray(data.games)) {
                renderGameList(typingContent, data.games);
            } else if ((data.type === 'generated' || data.type === 'play') && data.game) {
                renderGameCard(typingContent, data.game, data.type === 'generated');
            }

            history.push({ role: 'bot', text: data.reply || '' });
        } catch (err) {
            typingContent.innerHTML = '';
            const errP = document.createElement('div');
            errP.className = 'error-text';
            errP.textContent = "Couldn't reach the server. Is app.py running?";
            typingContent.appendChild(errP);
        } finally {
            sendBtn.disabled = false;
            scrollToBottom();
        }
    }

    chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendMessage(chatInput.value);
    });

    chipsRow.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (chip) sendMessage(chip.dataset.msg);
    });

    // Opening message from the bot, no server round-trip needed.
    (function greet() {
        const content = addBotBubble();
        content.textContent = "Hey! Tell me a concept or algorithm you want to learn " +
            "(e.g. \"Dijkstra's algorithm\" or \"Q-learning\") and I'll build an interactive " +
            "puzzle for it. Or tap \u201cSee all games\u201d to browse what's already there.";
    })();
</script>
</body>
</html>
